airbnb:
  outputs:
    staging:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_USER') }}"

      role: TRANSFORM
      private_key_path: "C:/Users/dinesh gowd/.dbt/dbt_key_verified.p8"
      private_key_passphrase: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"

      database: AIRBNB
      schema: STAGING
      threads: 4
      warehouse: COMPUTE_WH
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_USER') }}"

      role: TRANSFORM
      private_key_path: "C:/Users/dinesh gowd/.dbt/dbt_key_verified.p8"
      private_key_passphrase: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"


      database: AIRBNB
      schema: PROD
      threads: 4
      warehouse: COMPUTE_WH
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('DBT_USER') }}"

      role: TRANSFORM
      private_key_path: "C:/Users/dinesh gowd/.dbt/dbt_key_verified.p8"
      private_key_passphrase: "{{ env_var('DBT_ENV_SECRET_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"

      database: AIRBNB
      schema: "DBT_{{ env_var('DBT_ENV_NAME') | upper | trim }}"
      threads: 4
      warehouse: COMPUTE_WH

  target: dev